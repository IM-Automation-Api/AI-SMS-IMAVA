steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/AI-SMS-IMAVA:$COMMIT_SHA', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/AI-SMS-IMAVA:$COMMIT_SHA']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'AI-SMS-IMAVA'
      - '--image'
      - 'gcr.io/$PROJECT_ID/AI-SMS-IMAVA:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'VITE_SUPABASE_URL=$$VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY=$$VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_SERVICE_KEY=$$VITE_SUPABASE_SERVICE_KEY,PUBLIC_SUPABASE_URL=$$PUBLIC_SUPABASE_URL,SMTP_HOST=$$SMTP_HOST,SMTP_PORT=$$SMTP_PORT,RESEND_API_KEY=$$RESEND_API_KEY,GROQ_API_KEY=$$GROQ_API_KEY,VITE_ENABLE_ANALYTICS=true,VITE_ENABLE_VOICE_FEATURES=true,VITE_APP_VERSION=1.0.0'

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/AI-SMS-IMAVA:$COMMIT_SHA'

timeout: 1800s
