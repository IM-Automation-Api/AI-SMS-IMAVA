<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .loading {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
        }
    </style>
</head>
<body>
    <h1>Direct Login</h1>
    
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" value="merandafreiner3@gmail.com">
    </div>
    
    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" value="Panda6290">
    </div>
    
    <button id="loginButton">Login</button>
    
    <div style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 20px;">
        <h3>Redirection Tests</h3>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button id="testWindowLocation" style="background-color: #007bff;">Test window.location.href</button>
            <button id="testWindowReplace" style="background-color: #28a745;">Test window.location.replace</button>
            <button id="testWindowAssign" style="background-color: #fd7e14;">Test window.location.assign</button>
            <button id="testWindowOpen" style="background-color: #6f42c1;">Test window.open</button>
            <button id="testDocumentLocation" style="background-color: #e83e8c;">Test document.location</button>
        </div>
    </div>
    
    <div id="status" class="status" style="display: none; margin-top: 20px;"></div>
    
    <div style="margin-top: 20px;">
        <h3>Session Info</h3>
        <button id="checkSession" style="background-color: #17a2b8;">Check Current Session</button>
        <pre id="sessionInfo" style="background-color: #f8f9fa; padding: 10px; margin-top: 10px; border-radius: 4px; max-height: 200px; overflow: auto;"></pre>
    </div>
    
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        
        // Initialize Supabase client - these values should match your .env file
        // Note: In a production app, you would never expose these in client-side code
        // This is just for testing purposes
        const supabaseUrl = window.location.hostname === 'localhost' 
            ? 'http://localhost:54321' 
            : 'https://your-supabase-url.supabase.co';
        
        // Try to get the anon key from localStorage if it was previously saved
        let supabaseAnonKey = localStorage.getItem('supabaseAnonKey') || 'your-supabase-anon-key';
        
        // Allow the user to set the anon key if needed
        if (supabaseAnonKey === 'your-supabase-anon-key') {
            const userKey = prompt('Please enter your Supabase anon key (check your .env file for NEXT_PUBLIC_SUPABASE_ANON_KEY):');
            if (userKey) {
                supabaseAnonKey = userKey;
                localStorage.setItem('supabaseAnonKey', userKey);
            }
        }
        
        console.log('Using Supabase URL:', supabaseUrl);
        console.log('Using Supabase Anon Key:', supabaseAnonKey.substring(0, 5) + '...');
        
        const supabase = createClient(supabaseUrl, supabaseAnonKey);
        
        // Get elements
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginButton = document.getElementById('loginButton');
        const statusDiv = document.getElementById('status');
        
        // Function to show status
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
        }
        
        // Login function
        async function login() {
            const email = emailInput.value;
            const password = passwordInput.value;
            
            if (!email || !password) {
                showStatus('Please enter both email and password', 'error');
                return;
            }
            
            try {
                showStatus('Logging in...', 'loading');
                loginButton.disabled = true;
                
                // Sign in with Supabase
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });
                
                if (error) {
                    console.error('Login error:', error);
                    showStatus(`Login error: ${error.message}`, 'error');
                    loginButton.disabled = false;
                    return;
                }
                
                if (data.user) {
                    console.log('Login successful:', data.user);
                    showStatus('Login successful! Redirecting...', 'success');
                    
                    // Try different redirection methods
                    setTimeout(() => {
                        try {
                            console.log('Redirecting with window.location.href');
                            window.location.href = '/dashboard';
                        } catch (redirectError) {
                            console.error('Redirect error:', redirectError);
                            showStatus(`Redirect error: ${redirectError.message}`, 'error');
                            loginButton.disabled = false;
                        }
                    }, 1000);
                } else {
                    showStatus('No user data returned', 'error');
                    loginButton.disabled = false;
                }
            } catch (err) {
                console.error('Login exception:', err);
                showStatus(`Login exception: ${err.message}`, 'error');
                loginButton.disabled = false;
            }
        }
        
        // Add event listeners
        loginButton.addEventListener('click', login);
        
        // Redirection test event listeners
        document.getElementById('testWindowLocation').addEventListener('click', () => {
            showStatus('Testing window.location.href redirection...', 'loading');
            console.log('Redirecting with window.location.href');
            setTimeout(() => {
                try {
                    window.location.href = '/dashboard';
                } catch (error) {
                    console.error('Redirect error:', error);
                    showStatus(`Redirect error: ${error.message}`, 'error');
                }
            }, 500);
        });
        
        document.getElementById('testWindowReplace').addEventListener('click', () => {
            showStatus('Testing window.location.replace redirection...', 'loading');
            console.log('Redirecting with window.location.replace');
            setTimeout(() => {
                try {
                    window.location.replace('/dashboard');
                } catch (error) {
                    console.error('Redirect error:', error);
                    showStatus(`Redirect error: ${error.message}`, 'error');
                }
            }, 500);
        });
        
        document.getElementById('testWindowAssign').addEventListener('click', () => {
            showStatus('Testing window.location.assign redirection...', 'loading');
            console.log('Redirecting with window.location.assign');
            setTimeout(() => {
                try {
                    window.location.assign('/dashboard');
                } catch (error) {
                    console.error('Redirect error:', error);
                    showStatus(`Redirect error: ${error.message}`, 'error');
                }
            }, 500);
        });
        
        document.getElementById('testWindowOpen').addEventListener('click', () => {
            showStatus('Testing window.open redirection...', 'loading');
            console.log('Redirecting with window.open');
            setTimeout(() => {
                try {
                    window.open('/dashboard', '_self');
                } catch (error) {
                    console.error('Redirect error:', error);
                    showStatus(`Redirect error: ${error.message}`, 'error');
                }
            }, 500);
        });
        
        document.getElementById('testDocumentLocation').addEventListener('click', () => {
            showStatus('Testing document.location redirection...', 'loading');
            console.log('Redirecting with document.location');
            setTimeout(() => {
                try {
                    document.location = '/dashboard';
                } catch (error) {
                    console.error('Redirect error:', error);
                    showStatus(`Redirect error: ${error.message}`, 'error');
                }
            }, 500);
        });
        
        // Session check event listener
        document.getElementById('checkSession').addEventListener('click', async () => {
            try {
                const sessionInfoElement = document.getElementById('sessionInfo');
                sessionInfoElement.textContent = 'Checking session...';
                
                const { data, error } = await supabase.auth.getSession();
                
                if (error) {
                    console.error('Session check error:', error);
                    sessionInfoElement.textContent = `Error: ${error.message}`;
                    return;
                }
                
                console.log('Session data:', data);
                sessionInfoElement.textContent = JSON.stringify(data, null, 2);
                
                if (data.session) {
                    showStatus('User is authenticated!', 'success');
                } else {
                    showStatus('No active session found', 'error');
                }
            } catch (err) {
                console.error('Session check exception:', err);
                document.getElementById('sessionInfo').textContent = `Exception: ${err.message}`;
            }
        });
        
        // Check session on page load
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data, error } = await supabase.auth.getSession();
                
                if (error) {
                    console.error('Initial session check error:', error);
                    return;
                }
                
                console.log('Initial session data:', data);
                
                if (data.session) {
                    document.getElementById('sessionInfo').textContent = 'User is already authenticated!';
                    showStatus('User is already authenticated!', 'success');
                }
            } catch (err) {
                console.error('Initial session check exception:', err);
            }
        });
    </script>
</body>
</html>
